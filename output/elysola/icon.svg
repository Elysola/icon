<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="currentColor" role="img" aria-labelledby="title desc">
  <title id="title">Elysola</title>
  <desc id="desc">由字母 E、S、太阳与贯穿弧线组成的 Elysola 标志</desc>
  <defs>
    <!-- 弧线上方负空间镂空遮罩 -->
    <mask id="solar-cutout-square">
      <rect width="280" height="140" fill="white" />
      <path d="M 24 96 Q 140 42 256 96 Q 140 51 24 96 Z" fill="black" stroke="black" stroke-width="6" />
    </mask>
  </defs>

  <!-- 居中与缩放容器：自动将图形几何中心对齐至 (256, 256) -->
  <g transform="translate(32, 136.8) scale(1.6)">
    <!-- 被地平线弧贯穿的紧凑 ES 主体 -->
    <g mask="url(#solar-cutout-square)">
      <!-- 字母 E -->
      <path d="M 48 22 H 124 A 9 9 0 0 1 124 40 H 68 V 61 H 114 A 9 9 0 0 1 114 79 H 68 V 100 H 124 A 9 9 0 0 1 124 118 H 48 A 6 6 0 0 1 42 112 V 28 A 6 6 0 0 1 48 22 Z" />
      <!-- 字母 S -->
      <path d="M 228 41 C 218 29 203 22 184 22 C 156 22 140 36 140 53 C 140 72 158 78 184 82 C 202 85 210 90 210 97 C 210 105 199 111 182 111 C 165 111 151 104 142 94 L 129 108 C 141 121 160 128 182 128 C 212 128 232 113 232 95 C 232 75 213 68 187 64 C 169 61 162 57 162 50 C 162 43 171 39 185 39 C 198 39 209 44 216 52 Z" />
    </g>

    <!-- 贯穿前景的破晓日冕弧线 -->
    <path d="M 24 98 Q 140 44 256 98 Q 140 57 24 98 Z" />
  </g>
</svg>