name: Validate icons

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Generate and validate assets
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Check reproducible generated output
        run: nix develop --command vectorloom check --config icons.json

      - name: Run Python lint
        run: >-
          nix develop --command ruff check
          main.py main_text.py generate.py validate.py geometry-kit/generate.py

      - name: Check Python formatting
        run: >-
          nix develop --command black --fast --check
          main.py main_text.py generate.py validate.py geometry-kit/generate.py
